<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebXR Top‑Down Shooter • Babylon.js (Wide Field + Y/Z Offsets)</title>
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0a0b10; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
  // =============================================================
  //  Babylon.js WebXR Top‑Down Shooter (refactor: wide board + live Y/Z recenter)
  //  • Board: 40 ft long (Z) x 20 ft wide (X)
  //  • Live controls to tweak recenter offsets (world Y height, forward Z distance)
  //  • Your gaze aligns with the ship's nose (+Z away from you)
  // =============================================================

  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

  async function createScene() {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.06, 1);
    // Add an environment map so PBR metal looks good
    scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env", scene);

    // --- Constants (meters) ---
    const FT = 0.3048;
    const TABLE_W = 20 * FT;      // 6.096 m (width, X)
    const TABLE_L = 40 * FT;      // 12.192 m (length, Z)
    const TABLE_Y = 0.90;         // local table height within the root
    const MARGIN  = 0.08;         // clamp margin from edges
    // Drop the board surface a few feet below the ship/drones
    const BOARD_DROP = 0.9;       // meters (~3 ft)
    const BOARD_Y = TABLE_Y - BOARD_DROP; // board height (root-local)

    // Recenter offsets (editable via UI)
    let offsetY = 0.76;   // world Y height for the near edge center (default ~30")
    let offsetZ = 0.18;   // world forward distance from camera to near edge center

    // Root that holds the entire game so we can rotate/position as one
    const root = new BABYLON.TransformNode('root', scene);

    // --- Desktop orbit camera (XR replaces this at runtime) ---
    const cam = new BABYLON.ArcRotateCamera(
      'cam',
      Math.PI/2,
      BABYLON.Tools.ToRadians(45), // ~45° downward
      8.0,
      new BABYLON.Vector3(0, TABLE_Y, 0),
      scene
    );
    cam.attachControl(canvas, true);
    cam.wheelPrecision = 80;
    cam.lowerBetaLimit = BABYLON.Tools.ToRadians(30);
    cam.upperBetaLimit = BABYLON.Tools.ToRadians(80);

    new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);

    // --- Rectangular tabletop board (root-local) ---
    const board = BABYLON.MeshBuilder.CreateGround('board', {
      width: TABLE_W, height: TABLE_L, subdivisions: 1
    }, scene);
    board.parent = root;
    board.position.set(0, BOARD_Y, 0);
    board.isPickable = true;

    // Ground material (cool slate) + scrolling grid overlay for motion cues
    const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.02, 0.08, 0.18); // darker ocean blue // slate/teal tone
    groundMat.specularColor = BABYLON.Color3.Black();
    const groundTex = new BABYLON.Texture('https://assets.babylonjs.com/environments/rockyGround.jpg', scene);
    // Tile approximately proportional to size so texel density stays pleasant
    groundTex.uScale = Math.max(16, Math.round(TABLE_W * 3));
    groundTex.vScale = Math.max(24, Math.round(TABLE_L * 3));
    groundMat.diffuseTexture = groundTex;
    board.material = groundMat;

    const overlay = BABYLON.MeshBuilder.CreateGround('overlay', { width: TABLE_W, height: TABLE_L }, scene);
    overlay.parent = root;
    overlay.position = board.position.clone(); overlay.position.y += 0.002;
    const gridMat = new BABYLON.StandardMaterial('gridMat', scene);
    gridMat.disableLighting = true; gridMat.backFaceCulling = false;
    const gridTex = new BABYLON.DynamicTexture('gridTex', { width: 1024, height: 1024 }, scene, true);
    gridTex.hasAlpha = true;
    const ctx = gridTex.getContext();
    (function drawGrid(){
      const N = 1024; ctx.clearRect(0,0,N,N); ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,N,N);
      ctx.strokeStyle = 'rgba(205,235,255,0.25)'; ctx.lineWidth = 2;
      for (let i=0;i<=N;i+=32){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,N); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(N,i); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(130,210,255,0.42)'; ctx.lineWidth = 2.4;
      for (let i=0;i<=N;i+=128){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,N); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(N,i); ctx.stroke(); }
      gridTex.update();
    })();
    gridMat.emissiveTexture = gridTex; gridMat.emissiveColor = new BABYLON.Color3(0.7,0.9,1);
    gridTex.uScale = Math.max(24, Math.round(TABLE_W * 4));
    gridTex.vScale = Math.max(32, Math.round(TABLE_L * 4));
    overlay.material = gridMat;
    // keep overlay riding just above the board even after dropping the board
    overlay.position = board.position.clone(); overlay.position.y += 0.002;

    // --- Player ship (root-local), facing +Z ---
    function buildShip(scene){
      const shipRoot = new BABYLON.TransformNode('ship', scene);

      // Metallic silver PBR
      const shipPBR = new BABYLON.PBRMetallicRoughnessMaterial('shipPBR', scene);
      shipPBR.baseColor = new BABYLON.Color3(0.88, 0.90, 0.95);
      shipPBR.metallic = 1.0; shipPBR.roughness = 0.25;

      // Core fuselage with a sleeker profile
      const fuse = BABYLON.MeshBuilder.CreateCapsule('fuse', { height: 0.42, radius: 0.06, tessellation: 12 }, scene);
      fuse.rotation.x = Math.PI/2;
      const spine = BABYLON.MeshBuilder.CreateCylinder('spine', { height: 0.36, diameterTop: 0.09, diameterBottom: 0.12, tessellation: 16 }, scene);
      spine.rotation.x = Math.PI/2;
      const nose = BABYLON.MeshBuilder.CreateCylinder('nose', { diameterTop: 0, diameterBottom: 0.12, height: 0.18, tessellation: 16 }, scene);
      nose.rotation.x = Math.PI/2; nose.position.z = 0.24;

      // Swept wings + canards
      const wingL = BABYLON.MeshBuilder.CreateBox('wingL', { width: 0.32, height: 0.01, depth: 0.12 }, scene);
      wingL.position.x = -0.18; wingL.rotation.y = BABYLON.Tools.ToRadians(12);
      const wingR = wingL.clone('wingR'); wingR.position.x = 0.18; wingR.rotation.y = -BABYLON.Tools.ToRadians(12);
      const canardL = BABYLON.MeshBuilder.CreateBox('canardL', { width: 0.16, height: 0.008, depth: 0.05 }, scene);
      canardL.position.set(-0.09, 0.02, 0.12); canardL.rotation.y = BABYLON.Tools.ToRadians(18);
      const canardR = canardL.clone('canardR'); canardR.position.x *= -1; canardR.rotation.y *= -1;

      // Tail and twin nacelles
      const tailV = BABYLON.MeshBuilder.CreateBox('tailV', { width: 0.05, height: 0.12, depth: 0.10 }, scene); tailV.position.set(0,0.10,-0.08);
      const nacL = BABYLON.MeshBuilder.CreateCylinder('nacL', { height: 0.24, diameter: 0.08, tessellation: 16 }, scene);
      nacL.rotation.x = Math.PI/2; nacL.position.set(-0.14, -0.03, -0.02);
      const nacR = nacL.clone('nacR'); nacR.position.x *= -1;

      ;[fuse, spine, nose, wingL, wingR, canardL, canardR, tailV, nacL, nacR].forEach(m=>m.material = shipPBR);
      const core = BABYLON.Mesh.MergeMeshes([fuse, spine, nose, wingL, wingR, canardL, canardR, tailV, nacL, nacR], true, true, undefined, false, true);
      core.parent = shipRoot;

      // Glass canopy
      const canopy = BABYLON.MeshBuilder.CreateSphere('canopy', { diameter: 0.16, segments: 16 }, scene);
      canopy.scaling.y = 0.7; canopy.position.set(0, 0.07, 0.10);
      const canopyMat = new BABYLON.StandardMaterial('canopyMat', scene);
      canopyMat.diffuseColor = new BABYLON.Color3(0.6,0.8,1.0); canopyMat.emissiveColor = new BABYLON.Color3(0.15,0.25,0.35); canopyMat.alpha = 0.55;
      canopy.material = canopyMat; canopy.parent = shipRoot;

      return shipRoot;
    }
    const ship = buildShip(scene);
    ship.parent = root;

    const nearLocalZ = -TABLE_L/2 + MARGIN; // near edge (toward you) in ROOT space
    ship.position = new BABYLON.Vector3(0, TABLE_Y + 0.05, nearLocalZ + 0.30);

    // Engine glow
    const glow = BABYLON.MeshBuilder.CreateDisc('glow', { radius: 0.06, tessellation: 32 }, scene);
    glow.rotation.x = Math.PI/2; glow.position = new BABYLON.Vector3(0, 0.02, ship.position.z - 0.18);
    const glowMat = new BABYLON.StandardMaterial('glowMat', scene);
    glowMat.emissiveColor = new BABYLON.Color3(0.2, 0.7, 1); glowMat.alpha = 0.6; glow.material = glowMat; glow.parent = ship;

    // Cursor (target) — root-local
    const cursor = BABYLON.MeshBuilder.CreateDisc('cursor', { radius: 0.07, tessellation: 32 }, scene);
    cursor.parent = root;
    const cursorMat = new BABYLON.StandardMaterial('cursorMat', scene);
    cursorMat.emissiveColor = new BABYLON.Color3(0.1, 0.85, 1); cursor.material = cursorMat;
    cursor.rotation.x = Math.PI/2; cursor.position.set(0, TABLE_Y + 0.01, ship.position.z + 0.8);

    // --- Movement: critically‑damped spring + arrive (all in ROOT space) ---
    const target = cursor.position.clone();
    let vel = new BABYLON.Vector3();
    const MAX_SPEED   = 1.6;                 // m/s cap
    const MAX_ACCEL   = 7.0;                 // m/s^2 cap
    const STIFFNESS   = 18.0;                // spring k
    const DAMPING     = 2 * Math.sqrt(STIFFNESS) * 0.95; // ~critically damped
    const SLOW_RADIUS = 0.9;                 // ease-in radius
    const ARRIVE_EPS  = 0.02;

    // Banking visuals (roll around Z based on lateral velocity)
    let bankAngle = 0;
    const BANK_FACTOR = 0.6;                            // how much to bank per m/s lateral
    const MAX_BANK = BABYLON.Tools.ToRadians(18);       // clamp
    const BANK_SMOOTH = 10;                             // lerp speed

    function clampLocalToBoard(vec) {
      const minX = -TABLE_W/2 + MARGIN;
      const maxX =  TABLE_W/2 - MARGIN;
      const minZ = -TABLE_L/2 + MARGIN;
      const maxZ =  TABLE_L/2 - MARGIN;
      vec.x = Math.min(maxX, Math.max(minX, vec.x));
      vec.z = Math.min(maxZ, Math.max(minZ, vec.z));
      vec.y = TABLE_Y + 0.05;
      return vec;
    }

    function worldToRoot(p) {
      const inv = root.getWorldMatrix().clone(); inv.invert();
      return BABYLON.Vector3.TransformCoordinates(p, inv);
    }

    // Desktop pointer steering -> pick board (WORLD) and convert to ROOT-LOCAL
    scene.onPointerMove = () => {
      const pick = scene.pick(scene.pointerX, scene.pointerY, m => m === board);
      if (pick && pick.hit) {
        const lp = worldToRoot(pick.pickedPoint);
        target.copyFrom(lp);
        clampLocalToBoard(target);
        cursor.position.copyFrom(target);
      }
    };

    // --- Bullets (pooled, root-local) ---
    const bulletPool = [];
    const BULLET_SPEED = 6.5;
    const BULLET_LIFE  = 1.25; // seconds
    const BULLET_RATE  = 0.12; // seconds between shots
    // Tiny homing parameters
    const TRACK_GAIN = 2.5;                 // how strongly bullets drift toward target
    const MAX_LATERAL_SPEED_BULLET = 1.2;   // clamp for side drift (m/s)
    let lastShotTime = -999; = -999;

    function makeBullet() {
      const mesh = BABYLON.MeshBuilder.CreateCylinder('bullet', { diameter: 0.03, height: 0.20 }, scene);
      mesh.parent = root;
      mesh.rotation.x = Math.PI/2;
      const mat = new BABYLON.StandardMaterial('bMat', scene);
      mat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.4);
      mat.specularColor = BABYLON.Color3.Black();
      mesh.material = mat; mesh.setEnabled(false);
      return { mesh, active:false, vel:new BABYLON.Vector3(0,0,BULLET_SPEED), t:0 };
    }
    for (let i=0;i<100;i++) bulletPool.push(makeBullet());

    function shoot() {
      const now = performance.now()/1000;
      if (now - lastShotTime < BULLET_RATE) return;
      lastShotTime = now;
      const b = bulletPool.find(x=>!x.active); if (!b) return;
      b.active = true; b.t = 0; b.mesh.setEnabled(true);
      b.mesh.position.copyFrom(ship.position); b.mesh.position.y = ship.position.y + 0.01;
    }

    // Desktop input
    scene.onPointerDown = (evt)=>{ if (evt.button===0) shoot(); };
    window.addEventListener('keydown', (e)=>{
      if (e.code==='Space') shoot();
      if (e.code==='Enter') setRunning(!running);
      if (e.code==='KeyR') recenterTable();
    });

    // --- Drones (root-local) ---
    const drones = [];
    const droneMat = new BABYLON.StandardMaterial('droneMat', scene);
    // Darker orange drones
    droneMat.diffuseColor = new BABYLON.Color3(0.85, 0.40, 0.12);
    droneMat.emissiveColor = new BABYLON.Color3(0.60, 0.28, 0.06);

    // Build a template drone with more geometry, then clone
    const droneTemplate = (function(){
      const parts = [];
      const body = BABYLON.MeshBuilder.CreateIcoSphere('dBody', { radius: 0.16, subdivisions: 2 }, scene); parts.push(body);
      const ring = BABYLON.MeshBuilder.CreateTorus('dRing', { thickness: 0.02, diameter: 0.34, tessellation: 24 }, scene);
      ring.rotation.x = Math.PI/2; ring.position.y = 0.01; parts.push(ring);
      for (let i = 0; i < 3; i++) {
        const arm = BABYLON.MeshBuilder.CreateBox('dArm'+i, { width: 0.04, height: 0.01, depth: 0.18 }, scene);
        const ang = i * Math.PI * 2 / 3; arm.position.y = -0.02; arm.position.x = Math.sin(ang) * 0.16; arm.position.z = Math.cos(ang) * 0.16; arm.rotation.y = ang; parts.push(arm);
      }
      const merged = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, true);
      merged.material = droneMat; merged.setEnabled(false);
      return merged;
    })();

    function makeDrone(){
      const mesh = droneTemplate.clone('drone');
      mesh.setEnabled(true); mesh.parent = root; mesh.material = droneMat; mesh.position.y = TABLE_Y + 0.05;
      mesh.rotation.y = Math.random() * Math.PI * 2;
      const d = { mesh, speed: 0.9 + Math.random()*0.7 };
      respawnDrone(d); return d;
    }
    function respawnDrone(d){
      d.mesh.position.x = -TABLE_W/2 + MARGIN + Math.random()*(TABLE_W-2*MARGIN);
      d.mesh.position.z =  TABLE_L/2 - 0.20; // far edge (root-local)
      d.speed = 0.9 + Math.random()*0.7;
    }
    for (let i=0;i<18;i++) drones.push(makeDrone());

    // --- Explosions (world-space anchor at exact drone position) ---
    function explodeAtMesh(m){
      const worldPos = m.getAbsolutePosition().clone();
      const anchor = new BABYLON.TransformNode('explAnchor', scene);
      anchor.position.copyFrom(worldPos);
      const ps = new BABYLON.ParticleSystem('expl', 120, scene);
      ps.particleTexture = new BABYLON.Texture('https://playground.babylonjs.com/textures/flare.png', scene);
      ps.emitter = anchor;
      ps.minEmitPower = 1; ps.maxEmitPower = 2.2;
      ps.minSize = 0.03; ps.maxSize = 0.09;
      ps.color1 = new BABYLON.Color4(1, 0.95, 0.5, 1);
      ps.color2 = new BABYLON.Color4(1, 0.70, 0.2, 1);
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
      ps.gravity = new BABYLON.Vector3(0, 0, 0);
      ps.emitRate = 0; ps.createSphereEmitter(0.22);
      ps.disposeOnStop = true; ps.manualEmitCount = 60; ps.start();
      setTimeout(()=>ps.stop(), 80);
      ps.onStoppedObservable.add(()=>anchor.dispose());
    }

    // --- GUI (score + pause + recenter controls) ---
    const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI('ui', true, scene);

    // Score / hints
    const scoreText = new BABYLON.GUI.TextBlock();
    scoreText.color = 'white'; scoreText.fontSize = 24; scoreText.top = '-45%';
    gui.addControl(scoreText);

    const hintText = new BABYLON.GUI.TextBlock();
    hintText.text = `Desktop: mouse steer, Space shoot, Enter Start/Pause, R Recenter.
Quest: point steer, Trigger shoot, A/X Start/Pause, B/Y Recenter.`;
    hintText.color = '#eef'; hintText.fontSize = 18; hintText.top = '-40%';
    gui.addControl(hintText);

    const pauseText = new BABYLON.GUI.TextBlock();
    pauseText.text = 'PAUSED'; pauseText.color = '#fff'; pauseText.fontSize = 42; pauseText.isVisible = true;
    gui.addControl(pauseText);

    // Recenter control panel (Y/Z)
    const ctrlBox = new BABYLON.GUI.Rectangle('ctrlBox');
    ctrlBox.width = '360px'; ctrlBox.height = '160px';
    ctrlBox.thickness = 1; ctrlBox.cornerRadius = 8;
    ctrlBox.color = '#9cf'; ctrlBox.background = 'rgba(10,16,26,0.55)';
    ctrlBox.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
    ctrlBox.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
    ctrlBox.top = '12px'; ctrlBox.left = '-12px';
    gui.addControl(ctrlBox);

    const stack = new BABYLON.GUI.StackPanel();
    stack.width = '100%'; ctrlBox.addControl(stack);

    const title = new BABYLON.GUI.TextBlock();
    title.text = 'Recenter Offsets'; title.color = '#cfefff'; title.height = '28px'; title.fontSize = 20;
    stack.addControl(title);

    function metersToFeet(m){ return m / 0.3048; }
    function fmtFeet(m){ return (metersToFeet(m)).toFixed(2) + ' ft'; }

    function makeRow(labelText, getVal, setVal, step, min, max){
      const row = new BABYLON.GUI.StackPanel(); row.isVertical = false; row.height = '44px'; row.width = '100%'; row.paddingTop = '4px';
      const label = new BABYLON.GUI.TextBlock(); label.text = labelText; label.width = '90px'; label.color = '#def'; label.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT; label.paddingLeft = '8px';
      const minus = BABYLON.GUI.Button.CreateSimpleButton('minus','–'); minus.width = '44px'; minus.height = '36px'; minus.color = '#9cf'; minus.thickness = 1; minus.cornerRadius = 6; minus.background = 'rgba(20,30,45,0.6)';
      const value = new BABYLON.GUI.TextBlock(); value.text = ''; value.width = '160px'; value.color = '#fff'; value.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
      const plus  = BABYLON.GUI.Button.CreateSimpleButton('plus','+'); plus.width = '44px'; plus.height = '36px'; plus.color = '#9cf'; plus.thickness = 1; plus.cornerRadius = 6; plus.background = 'rgba(20,30,45,0.6)';
      function refresh(){ const v = getVal(); value.text = v.toFixed(2)+' m  ('+fmtFeet(v)+')'; }
      minus.onPointerUpObservable.add(()=>{ const v = Math.max(min, getVal()-step); setVal(v); refresh(); recenterTable(); });
      plus.onPointerUpObservable.add(()=>{ const v = Math.min(max, getVal()+step); setVal(v); refresh(); recenterTable(); });
      refresh();
      row.addControl(label); row.addControl(minus); row.addControl(value); row.addControl(plus);
      return row;
    }

    // Y height row (0.3m .. 1.4m)
    stack.addControl(makeRow('Height Y', ()=>offsetY, v=>offsetY=v, 0.02, 0.30, 1.40));
    // Z forward row (0.05m .. 0.80m)
    stack.addControl(makeRow('Forward Z', ()=>offsetZ, v=>offsetZ=v, 0.02, 0.05, 0.80));

    let running = false, score = 0; function setRunning(v){ running = v; pauseText.isVisible = !v; }

    // --- WebXR setup ---
    let xr = null;
    try {
      xr = await scene.createDefaultXRExperienceAsync({ disableDefaultUI:false });
      // Auto-recenter as soon as we ENTER immersive VR
      if (xr && xr.baseExperience) {
        xr.baseExperience.onStateChangedObservable.add((state)=>{
          if (state === BABYLON.WebXRState.IN_XR) recenterTable();
        });
      }
      // Controller buttons
      xr.input.onControllerAddedObservable.add((controller)=>{
        controller.onMotionControllerInitObservable.add((mc)=>{
          const trigger = mc.getComponentOfType('trigger');
          if (trigger) trigger.onButtonStateChangedObservable.add((c)=>{ if (c.changes.pressed && c.pressed) shoot(); });
          const aBtn = mc.getComponent('a-button') || mc.getComponent('x-button');
          if (aBtn) aBtn.onButtonStateChangedObservable.add((c)=>{ if (c.changes.pressed && c.pressed) setRunning(!running); });
          const bBtn = mc.getComponent('b-button') || mc.getComponent('y-button');
          if (bBtn) bBtn.onButtonStateChangedObservable.add((c)=>{ if (c.changes.pressed && c.pressed) recenterTable(); });
        });
      });
    } catch(e){ console.warn('WebXR unavailable or failed to init.', e); }

    // Recenter/orient the whole table to face the active camera
    function recenterTable(){
      // Active camera (XR or desktop)
      const xrCam = (xr && xr.baseExperience && xr.baseExperience.camera) ? xr.baseExperience.camera : scene.activeCamera;
      const camPos = xrCam.globalPosition.clone();

      // Camera forward projected onto the table plane (Y=up)
      const fwdWorld = xrCam.getForwardRay(1).direction.clone();
      fwdWorld.y = 0; // ignore tilt
      if (fwdWorld.lengthSquared() < 1e-6) fwdWorld.set(0,0,1);
      fwdWorld.normalize();

      // Yaw that aligns ROOT +Z with camera forward (flip if opposite)
      let yaw = Math.atan2(fwdWorld.x, fwdWorld.z);
      let rotMat = BABYLON.Matrix.RotationY(yaw);
      const rootZWorld = BABYLON.Vector3.TransformNormal(new BABYLON.Vector3(0,0,1), rotMat).normalize();
      if (BABYLON.Vector3.Dot(rootZWorld, fwdWorld) < 0) { yaw += Math.PI; rotMat = BABYLON.Matrix.RotationY(yaw); }
      root.rotation.set(0, yaw, 0);

      // Place the NEAR edge center offsetZ in front of camera at height offsetY
      const localNearCenter = new BABYLON.Vector3(0, BOARD_Y, -TABLE_L/2); // near edge in ROOT space
      const worldNearOffset = BABYLON.Vector3.TransformCoordinates(localNearCenter, rotMat);
      const desiredNearWorld = camPos.add(fwdWorld.scale(offsetZ));
      desiredNearWorld.y = offsetY; // lock tabletop height
      root.position.copyFrom(desiredNearWorld.subtract(worldNearOffset));

      // For desktop, also point the orbit target roughly into the table
      if (!xr) {
        const lookLocal = new BABYLON.Vector3(0, TABLE_Y, TABLE_L*0.25);
        const lookWorld = BABYLON.Vector3.TransformCoordinates(lookLocal, root.getWorldMatrix());
        cam.setTarget(lookWorld);
      }
    }

    // Initial recenter for desktop
    recenterTable();

    // XR steering: ray‑pick board (WORLD), convert to ROOT-LOCAL
    function steerFromXRControllers(){
      if (!xr) return;
      xr.input.controllers.forEach((ctrl)=>{
        const pointer = ctrl.pointer; if (!pointer) return;
        const origin = pointer.getAbsolutePosition();
        const fwd    = pointer.getDirection(BABYLON.Axis.Z);
        const ray = new BABYLON.Ray(origin, fwd, 25);
        const pick = scene.pickWithRay(ray, (m)=>m===board);
        if (pick && pick.hit){
          const lp = worldToRoot(pick.pickedPoint);
          target.copyFrom(lp); clampLocalToBoard(target); cursor.position.copyFrom(target);
        }
      });
    }

    // --- Frame update ---
    scene.onBeforeRenderObservable.add(()=>{
      const dt = engine.getDeltaTime()/1000;
      steerFromXRControllers();

      scoreText.text = `Score: ${score} ${running ? '' : '(paused)'}`;

      // Scroll textures to feel like ground moving TOWARD you (from +Z to -Z in root)
      const scrollSpeed = 0.45;
      groundTex.vOffset += dt * scrollSpeed * 0.25;
      gridTex.vOffset   += dt * scrollSpeed * 0.9;

      if (!running) return;

      // Ship motion (spring + arrive) in ROOT space
      clampLocalToBoard(target);
      const toTarget = target.subtract(ship.position);
      const dist = toTarget.length();
      const arriveFactor = Math.min(1, dist / SLOW_RADIUS);
      let acc = toTarget.scale(STIFFNESS * arriveFactor).subtract(vel.scale(DAMPING));
      const accLen = acc.length(); if (accLen > MAX_ACCEL) acc.scaleInPlace(MAX_ACCEL/accLen);
      vel.addInPlace(acc.scale(dt));
      const speed = vel.length(); const maxSp = MAX_SPEED * (0.6 + 0.4*arriveFactor);
      if (speed > maxSp) vel.scaleInPlace(maxSp/speed);
      ship.position.addInPlace(vel.scale(dt)); clampLocalToBoard(ship.position);
      if (dist < ARRIVE_EPS && speed < 0.05){ ship.position.copyFrom(target); vel.scaleInPlace(0); }

      // Visual bank based on lateral velocity (no heading change)
      const desiredBank = BABYLON.Scalar.Clamp(-vel.x * BANK_FACTOR, -MAX_BANK, MAX_BANK);
      bankAngle += (desiredBank - bankAngle) * Math.min(1, dt * BANK_SMOOTH);
      ship.rotation.z = bankAngle;

      // Bullets (root-local motion)
      for (const b of bulletPool){
        if (!b.active) continue;
        b.t += dt;
        // Find nearest oncoming drone (ahead in +Z) and nudge laterally toward it
        let targetD = null; let best = 1e9;
        for (const d of drones){
          const dz = d.mesh.position.z - b.mesh.position.z;
          if (dz >= -0.1){
            const dx = Math.abs(d.mesh.position.x - b.mesh.position.x);
            const score = dx + dz * 0.15; // prefer close in X, modest weight for Z proximity
            if (score < best){ best = score; targetD = d; }
          }
        }
        if (targetD){
          const dx = targetD.mesh.position.x - b.mesh.position.x;
          b.vel.x += dx * TRACK_GAIN * dt;
          if (b.vel.x >  MAX_LATERAL_SPEED_BULLET) b.vel.x =  MAX_LATERAL_SPEED_BULLET;
          if (b.vel.x < -MAX_LATERAL_SPEED_BULLET) b.vel.x = -MAX_LATERAL_SPEED_BULLET;
        }
        // Keep forward speed constant
        b.vel.z = BULLET_SPEED;
        b.mesh.position.addInPlace(b.vel.scale(dt));
        if (b.t > BULLET_LIFE || b.mesh.position.z > (TABLE_L/2 + 0.3)){ b.active=false; b.mesh.setEnabled(false); }
      }

      // Drones move toward near edge (decreasing z in ROOT space)
      for (const d of drones){
        d.mesh.position.z -= d.speed * dt;
        if (d.mesh.position.z < (-TABLE_L/2 + 0.20)) respawnDrone(d);
      }

      // Collisions (2D XZ in ROOT space)
      outer: for (const d of drones){
        for (const b of bulletPool){
          if (!b.active) continue;
          const dx = b.mesh.position.x - d.mesh.position.x;
          const dz = b.mesh.position.z - d.mesh.position.z;
          if (dx*dx + dz*dz < 0.14*0.14){
            explodeAtMesh(d.mesh);
            score += 100; respawnDrone(d); b.active=false; b.mesh.setEnabled(false);
            continue outer;
          }
        }
      }
    });

    return scene;
  }

  createScene().then(scene => { engine.runRenderLoop(()=>scene.render()); });
  window.addEventListener('resize', ()=>engine.resize());
  </script>
</body>
</html>
