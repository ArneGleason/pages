<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebXR Top‑Down Shooter • Babylon.js</title>
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0a0b10; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
  // --- Basic engine/scene setup ---
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

  async function createScene() {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.06, 1);

    // Root transform so we can rotate the whole table 180° around Y as requested
    const root = new BABYLON.TransformNode("root", scene);
    root.rotation.y = Math.PI; // flip so +Z in local goes AWAY from you

    // Desktop camera (XR will replace at runtime)
    const cam = new BABYLON.ArcRotateCamera("cam",
      Math.PI / 2, BABYLON.Tools.ToRadians(70), 5,
      new BABYLON.Vector3(0, 0, 2.8), scene);
    cam.attachControl(canvas, true);
    cam.wheelPrecision = 80;
    cam.lowerBetaLimit = BABYLON.Tools.ToRadians(50);
    cam.upperBetaLimit = BABYLON.Tools.ToRadians(88);

    new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);

    // --- Tabletop board & scrolling ground ---
    const BOARD_W = 2.8;   // meters (x)
    const BOARD_H = 5.6;   // meters (z)

    const board = BABYLON.MeshBuilder.CreateGround("board", {
      width: BOARD_W, height: BOARD_H, subdivisions: 1
    }, scene);
    board.parent = root;
    board.position.set(0, 0, 2.6); // comfortably in front
    board.isPickable = true;

    // Base ground material (cool slate tone) + overlaid scrolling grid for speed lines
    const baseMat = new BABYLON.StandardMaterial("baseMat", scene);
    baseMat.specularColor = BABYLON.Color3.Black();
    baseMat.diffuseColor = new BABYLON.Color3(0.12, 0.20, 0.30); // slate/teal — distinct from enemy dots
    const baseTex = new BABYLON.Texture("https://assets.babylonjs.com/environments/rockyGround.jpg", scene);
    baseTex.uScale = 10; baseTex.vScale = 20; // subtle detail
    baseMat.diffuseTexture = baseTex;
    board.material = baseMat;

    // Grid overlay plane (very close above board) for parallax lines
    const overlay = BABYLON.MeshBuilder.CreateGround("overlay", { width: BOARD_W, height: BOARD_H }, scene);
    overlay.parent = root;
    overlay.position = board.position.clone();
    overlay.position.y += 0.002;
    const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
    gridMat.disableLighting = true;
    gridMat.backFaceCulling = false;
    const gridTex = new BABYLON.DynamicTexture("gridTex", { width: 256, height: 256 }, scene, true);
    gridTex.hasAlpha = true;
    const ctx = gridTex.getContext();
    function drawGrid() {
      ctx.clearRect(0,0,256,256);
      ctx.fillStyle = "rgba(0,0,0,0)"; ctx.fillRect(0,0,256,256);
      ctx.strokeStyle = "rgba(200,230,255,0.25)"; ctx.lineWidth = 2; // light cyan
      for (let i=0;i<=256;i+=32){
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(120,200,255,0.38)"; ctx.lineWidth = 2.5; // majors
      for (let i=0;i<=256;i+=128){
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke();
      }
      gridTex.update();
    }
    drawGrid();
    gridMat.emissiveTexture = gridTex;
    gridMat.emissiveColor = new BABYLON.Color3(0.7,0.9,1.0);
    gridTex.uScale = 8; gridTex.vScale = 16; // tiling
    overlay.material = gridMat;

    // --- Player ship (upped geometry) ---
    // Build from simple pieces then merge
    const fuselage = BABYLON.MeshBuilder.CreateCapsule("fuselage", { height: 0.38, radius: 0.055, tessellation: 8 }, scene);
    fuselage.rotation.x = Math.PI/2; // point along +Z (local to root)
    const nose = BABYLON.MeshBuilder.CreateCylinder("nose", { diameterTop: 0, diameterBottom: 0.12, height: 0.18, tessellation: 8 }, scene);
    nose.rotation.x = Math.PI/2; nose.position.z = 0.23;
    const wingL = BABYLON.MeshBuilder.CreateBox("wingL", { width: 0.26, height: 0.01, depth: 0.1 }, scene); wingL.position.x=-0.16;
    const wingR = wingL.clone("wingR"); wingR.position.x=0.16;
    const tail = BABYLON.MeshBuilder.CreateBox("tail", { width: 0.04, height: 0.1, depth: 0.1 }, scene); tail.position.set(0,0.09,-0.08);
    const shipMat = new BABYLON.StandardMaterial("shipMat", scene);
    shipMat.emissiveColor = new BABYLON.Color3(0.75, 0.9, 1);
    shipMat.diffuseColor = new BABYLON.Color3(0.05, 0.1, 0.15);
    ;[fuselage, nose, wingL, wingR, tail].forEach(m=>m.material = shipMat);
    const ship = BABYLON.Mesh.MergeMeshes([fuselage, nose, wingL, wingR, tail], true, true, undefined, false, true);
    ship.parent = root;

    ship.position = new BABYLON.Vector3(0, 0.05, board.position.z - BOARD_H / 2 + 0.45); // near edge

    // Engine glow
    const glow = BABYLON.MeshBuilder.CreateDisc("glow", { radius: 0.06, tessellation: 32 }, scene);
    glow.position = new BABYLON.Vector3(0, 0.02, ship.position.z - 0.18);
    glow.rotation.x = Math.PI/2;
    const glowMat = new BABYLON.StandardMaterial("glowMat", scene);
    glowMat.emissiveColor = new BABYLON.Color3(0.2, 0.7, 1);
    glowMat.alpha = 0.6; glow.material = glowMat; glow.parent = ship;

    // Target cursor (where the ship tries to go with smoothing) — in ROOT LOCAL space
    const cursor = BABYLON.MeshBuilder.CreateDisc("cursor", { radius: 0.07, tessellation: 32 }, scene);
    cursor.parent = root;
    const cursorMat = new BABYLON.StandardMaterial("cursorMat", scene);
    cursorMat.emissiveColor = new BABYLON.Color3(0.1, 0.85, 1);
    cursor.material = cursorMat;
    cursor.rotation.x = Math.PI / 2;
    cursor.position.set(0, 0.01, ship.position.z + 0.7);

    // Movement model: critically‑damped spring + arrival slow‑down (tighter, no wobble)
    const target = cursor.position.clone(); // **root-local**
    let vel = new BABYLON.Vector3();        // **root-local**
    const MAX_SPEED = 1.6;          // m/s cap
    const MAX_ACCEL = 7.0;          // m/s^2 cap
    const STIFFNESS = 18.0;         // spring stiffness (higher = snappier)
    const DAMPING = 2 * Math.sqrt(STIFFNESS) * 0.95; // ~critical damping
    const SLOW_RADIUS = 0.9;        // start slowing when closer than this
    const ARRIVE_EPS = 0.02;        // snap rest threshold

    function clampToBoard(vec, margin = 0.14) {
      const minX = board.position.x - BOARD_W / 2 + margin;
      const maxX = board.position.x + BOARD_W / 2 - margin;
      const minZ = board.position.z - BOARD_H / 2 + margin;
      const maxZ = board.position.z + BOARD_H / 2 - margin;
      vec.x = Math.max(minX, Math.min(maxX, vec.x));
      vec.z = Math.max(minZ, Math.min(maxZ, vec.z));
      return vec;
    }

    // Helper: convert a WORLD-space point to ROOT-local
    function worldToRoot(p) {
      const inv = root.getWorldMatrix().clone(); inv.invert();
      return BABYLON.Vector3.TransformCoordinates(p, inv);
    }

    // Desktop pointer steering (pick world → convert to root-local)
    scene.onPointerMove = () => {
      const pick = scene.pick(scene.pointerX, scene.pointerY, m => m === board);
      if (pick && pick.hit) {
        const lp = worldToRoot(pick.pickedPoint);
        target.copyFrom(lp);
        target.y = ship.position.y;
        clampToBoard(target);
        cursor.position.copyFrom(target);
      }
    };

    // --- Bullets (pooled) — parented to root; move in ROOT-LOCAL +Z (ship nose) ---
    const bulletPool = [];
    const BULLET_SPEED = 6.5;
    const BULLET_LIFE = 1.25; // seconds
    const BULLET_RATE = 0.12; // seconds between shots
    let lastShotTime = -999;

    function makeBullet() {
      const mesh = BABYLON.MeshBuilder.CreateCylinder("bullet", { diameter: 0.03, height: 0.2 }, scene);
      mesh.parent = root;
      mesh.rotation.x = Math.PI / 2;
      const mat = new BABYLON.StandardMaterial("bMat", scene);
      mat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.4); // yellowish, less red
      mat.specularColor = BABYLON.Color3.Black();
      mesh.material = mat;
      mesh.setEnabled(false);
      return { mesh, active: false, vel: new BABYLON.Vector3(0,0,BULLET_SPEED), t: 0 };
    }
    for (let i = 0; i < 60; i++) bulletPool.push(makeBullet());

    function shoot() {
      const now = performance.now() / 1000;
      if (now - lastShotTime < BULLET_RATE) return;
      lastShotTime = now;
      const b = bulletPool.find(x => !x.active);
      if (!b) return;
      b.active = true; b.t = 0;
      b.mesh.setEnabled(true);
      b.mesh.position.copyFrom(ship.position);
      b.mesh.position.y = ship.position.y + 0.01;
    }

    // Desktop shoot + pause
    scene.onPointerDown = (evt) => { if (evt.button === 0) shoot(); };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') shoot();
      if (e.code === 'Enter') setRunning(!running);
    });

    // --- Drones (simple enemies) ---
    const drones = [];
    const droneMat = new BABYLON.StandardMaterial("droneMat", scene);
    droneMat.diffuseColor = new BABYLON.Color3(1.0, 0.83, 0.3); // warm yellow dots
    droneMat.emissiveColor = new BABYLON.Color3(0.9, 0.75, 0.25);

    function makeDrone() {
      const mesh = BABYLON.MeshBuilder.CreateSphere("drone", { diameter: 0.24, segments: 10 }, scene);
      mesh.parent = root;
      mesh.material = droneMat;
      mesh.position.y = ship.position.y + 0.02;
      const drone = { mesh, speed: 0.9 + Math.random() * 0.7 };
      respawnDrone(drone);
      return drone;
    }

    function respawnDrone(d) {
      const margin = 0.16;
      d.mesh.position.x = board.position.x - BOARD_W / 2 + margin + Math.random() * (BOARD_W - 2 * margin);
      d.mesh.position.z = board.position.z + BOARD_H / 2 - 0.28; // far edge
      d.speed = 0.9 + Math.random() * 0.7;
    }

    for (let i = 0; i < 12; i++) drones.push(makeDrone());

    // --- Explosions (less red) ---
    function explode(at) {
      const ps = new BABYLON.ParticleSystem("expl", 100, scene);
      ps.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
      ps.emitter = at.clone();
      ps.minEmitPower = 1; ps.maxEmitPower = 2.2;
      ps.minSize = 0.03; ps.maxSize = 0.09;
      ps.color1 = new BABYLON.Color4(1, 0.95, 0.5, 1); // golden
      ps.color2 = new BABYLON.Color4(1, 0.7, 0.2, 1);  // amber
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
      ps.gravity = new BABYLON.Vector3(0, 0, 0);
      ps.emitRate = 0; // manual burst
      ps.createSphereEmitter(0.22);
      ps.disposeOnStop = true;
      ps.manualEmitCount = 60; ps.start(); setTimeout(() => ps.stop(), 80);
    }

    // --- GUI (score + pause indicator) ---
    const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("ui", true, scene);
    const scoreText = new BABYLON.GUI.TextBlock();
    scoreText.color = "white"; scoreText.fontSize = 24; scoreText.top = "-45%";
    gui.addControl(scoreText);
    const hintText = new BABYLON.GUI.TextBlock();
    hintText.text = `Desktop: move mouse to steer, Space to shoot, Enter to Start/Pause.
Quest VR: point to steer, Trigger to shoot, A/X to Start/Pause.`;
    hintText.color = "#eef"; hintText.fontSize = 18; hintText.top = "-40%";
    gui.addControl(hintText);
    const pauseText = new BABYLON.GUI.TextBlock();
    pauseText.text = "PAUSED"; pauseText.color = "#fff"; pauseText.fontSize = 42; pauseText.isVisible = true;
    gui.addControl(pauseText);

    let running = false; let score = 0;
    function setRunning(v) { running = v; pauseText.isVisible = !v; }

    // --- WebXR setup ---
    let xr = null;
    try {
      xr = await scene.createDefaultXRExperienceAsync({ disableDefaultUI: false });
      // Controller buttons: trigger = shoot, A/X = pause
      xr.input.onControllerAddedObservable.add((controller) => {
        controller.onMotionControllerInitObservable.add((mc) => {
          const trigger = mc.getComponentOfType("trigger");
          if (trigger) {
            trigger.onButtonStateChangedObservable.add((comp) => {
              if (comp.changes.pressed && comp.pressed) shoot();
            });
          }
          const aBtn = mc.getComponent("a-button") || mc.getComponent("x-button");
          if (aBtn) {
            aBtn.onButtonStateChangedObservable.add((comp) => {
              if (comp.changes.pressed && comp.pressed) setRunning(!running);
            });
          }
        });
      });
    } catch (e) {
      console.warn("WebXR unavailable or failed to init.", e);
    }

    // Controller ray -> board picking (pick in WORLD, convert to ROOT-LOCAL)
    function steerFromXRControllers() {
      if (!xr) return;
      xr.input.controllers.forEach((ctrl) => {
        const pointer = ctrl.pointer; if (!pointer) return;
        const origin = pointer.getAbsolutePosition();
        const fwd = pointer.getDirection(BABYLON.Axis.Z); // controller forward (WORLD)
        const ray = new BABYLON.Ray(origin, fwd, 10);
        const pick = scene.pickWithRay(ray, (m) => m === board);
        if (pick && pick.hit) {
          const lp = worldToRoot(pick.pickedPoint);
          target.copyFrom(lp); target.y = ship.position.y;
          clampToBoard(target);
          cursor.position.copyFrom(target);
        }
      });
    }

    // --- Frame update ---
    scene.onBeforeRenderObservable.add(() => {
      const dt = engine.getDeltaTime() / 1000;

      // Always allow steering updates (even when paused)
      steerFromXRControllers();

      // Update GUI text
      scoreText.text = `Score: ${score} ${running ? '' : '(paused)'}`;

      // Scroll ground so it moves TOWARD the player (parallax)
      const scrollSpeed = 0.45; // base
      baseTex.vOffset -= dt * scrollSpeed * 0.3;
      gridTex.vOffset -= dt * scrollSpeed * 0.9;

      if (!running) return; // game logic frozen

      // Ship movement using critically‑damped spring + arrival slowdown (root-local)
      clampToBoard(target);
      const toTarget = target.subtract(ship.position);
      const dist = toTarget.length();

      // Arrival: reduce max speed when close so it eases in
      const arriveFactor = Math.min(1, dist / SLOW_RADIUS);

      // Spring‑damper acceleration
      let acc = toTarget.scale(STIFFNESS * arriveFactor).subtract(vel.scale(DAMPING));
      // Clamp acceleration
      const accLen = acc.length();
      if (accLen > MAX_ACCEL) acc.scaleInPlace(MAX_ACCEL / accLen);

      // Integrate velocity, clamp speed
      vel.addInPlace(acc.scale(dt));
      const speed = vel.length();
      const maxSp = MAX_SPEED * (0.6 + 0.4*arriveFactor); // taper top speed when close
      if (speed > maxSp) vel.scaleInPlace(maxSp / speed);

      // Integrate position
      ship.position.addInPlace(vel.scale(dt));
      clampToBoard(ship.position);

      // Settle at target when very close
      if (dist < ARRIVE_EPS && speed < 0.05) {
        ship.position.copyFrom(target);
        vel.scaleInPlace(0);
      }

      // Bullets (root-local)
      for (const b of bulletPool) {
        if (!b.active) continue;
        b.t += dt;
        b.mesh.position.addInPlace(b.vel.scale(dt));
        // off-board or expired
        if (b.t > BULLET_LIFE || b.mesh.position.z > board.position.z + BOARD_H / 2 + 0.3) {
          b.active = false; b.mesh.setEnabled(false);
        }
      }

      // Enemies approach player (from far edge toward ship) in root-local
      for (const d of drones) {
        d.mesh.position.z -= d.speed * dt; // toward near edge
        if (d.mesh.position.z < board.position.z - BOARD_H / 2 + 0.22) {
          respawnDrone(d);
        }
      }

      // Bullet vs Drone collisions (simple 2D circle check in XZ)
      outer: for (const d of drones) {
        for (const b of bulletPool) {
          if (!b.active) continue;
          const dx = b.mesh.position.x - d.mesh.position.x;
          const dz = b.mesh.position.z - d.mesh.position.z;
          if (dx * dx + dz * dz < 0.11 * 0.11) {
            explode(d.mesh.position);
            score += 100;
            respawnDrone(d);
            b.active = false; b.mesh.setEnabled(false);
            continue outer;
          }
        }
      }
    });

    return scene;
  }

  createScene().then(scene => {
    engine.runRenderLoop(() => scene.render());
  });
  window.addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
