<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebXR Top‑Down Shooter • Babylon.js (Refactor)</title>
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0a0b10; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
  // =============================================================
  //  Babylon.js WebXR Top‑Down Shooter (clean refactor)
  //  • Square tabletop (4ft ≈ 1.22m) at ~desk height in front of you
  //  • God's‑eye view: +Z is AWAY from you, X left/right, Y up
  //  • Ship starts near the near edge (toward you), bullets fire +Z
  //  • Ground scrolls TOWARD you; drones descend from far edge
  //  • Critically‑damped steer with “arrive” slow‑down
  // =============================================================

  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

  async function createScene() {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.06, 1);

    // --- Constants (meters) ---
    const TABLE_SIZE = 1.22;      // 4 ft square
    const TABLE_Y    = 0.90;      // desk height
    const BOARD_Z    = 0.72;      // center distance from origin; near edge ~0.11m from you
    const MARGIN     = 0.06;      // clamp margin from edges

    // --- Desktop camera (XR replaces this at runtime) ---
    const cam = new BABYLON.ArcRotateCamera(
      'cam',
      Math.PI/2,                        // alpha: look along +Z
      BABYLON.Tools.ToRadians(45),      // beta: ~45° downward
      2.0,                              // radius
      new BABYLON.Vector3(0, TABLE_Y, BOARD_Z),
      scene
    );
    cam.attachControl(canvas, true);
    cam.wheelPrecision = 80;
    cam.lowerBetaLimit = BABYLON.Tools.ToRadians(35);
    cam.upperBetaLimit = BABYLON.Tools.ToRadians(80);

    new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);

    // --- Square tabletop board ---
    const board = BABYLON.MeshBuilder.CreateGround('board', {
      width: TABLE_SIZE, height: TABLE_SIZE, subdivisions: 1
    }, scene);
    board.position.set(0, TABLE_Y, BOARD_Z);
    board.isPickable = true;

    // Ground material (cool slate) + scrolling grid overlay for motion cues
    const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.10, 0.18, 0.26); // slate/teal tone
    groundMat.specularColor = BABYLON.Color3.Black();
    const groundTex = new BABYLON.Texture('https://assets.babylonjs.com/environments/rockyGround.jpg', scene);
    groundTex.uScale = 8; groundTex.vScale = 8; // subtle detail
    groundMat.diffuseTexture = groundTex;
    board.material = groundMat;

    const overlay = BABYLON.MeshBuilder.CreateGround('overlay', { width: TABLE_SIZE, height: TABLE_SIZE }, scene);
    overlay.position = board.position.clone(); overlay.position.y += 0.002;
    const gridMat = new BABYLON.StandardMaterial('gridMat', scene);
    gridMat.disableLighting = true; gridMat.backFaceCulling = false;
    const gridTex = new BABYLON.DynamicTexture('gridTex', { width: 256, height: 256 }, scene, true);
    gridTex.hasAlpha = true;
    const ctx = gridTex.getContext();
    (function drawGrid(){
      ctx.clearRect(0,0,256,256);
      ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,256,256);
      ctx.strokeStyle = 'rgba(205,235,255,0.28)'; ctx.lineWidth = 2;
      for (let i=0;i<=256;i+=32){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke();
                                  ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(130,210,255,0.42)'; ctx.lineWidth = 2.4;
      for (let i=0;i<=256;i+=128){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke();
                                   ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); }
      gridTex.update();
    })();
    gridMat.emissiveTexture = gridTex; gridMat.emissiveColor = new BABYLON.Color3(0.7,0.9,1);
    gridTex.uScale = 8; gridTex.vScale = 8; overlay.material = gridMat;

    // --- Player ship (simple kitbash), oriented +Z (away) ---
    const fuselage = BABYLON.MeshBuilder.CreateCapsule('fuse', { height: 0.36, radius: 0.055, tessellation: 8 }, scene);
    fuselage.rotation.x = Math.PI/2;
    const nose = BABYLON.MeshBuilder.CreateCylinder('nose', { diameterTop: 0, diameterBottom: 0.11, height: 0.16, tessellation: 8 }, scene);
    nose.rotation.x = Math.PI/2; nose.position.z = 0.22;
    const wingL = BABYLON.MeshBuilder.CreateBox('wingL', { width: 0.24, height: 0.01, depth: 0.10 }, scene); wingL.position.x = -0.15;
    const wingR = wingL.clone('wingR'); wingR.position.x = 0.15;
    const tail = BABYLON.MeshBuilder.CreateBox('tail', { width: 0.04, height: 0.10, depth: 0.10 }, scene); tail.position.set(0,0.09,-0.08);
    const shipMat = new BABYLON.StandardMaterial('shipMat', scene);
    shipMat.emissiveColor = new BABYLON.Color3(0.75, 0.9, 1);
    shipMat.diffuseColor  = new BABYLON.Color3(0.05, 0.10, 0.15);
    ;[fuselage, nose, wingL, wingR, tail].forEach(m=>m.material = shipMat);
    const ship = BABYLON.Mesh.MergeMeshes([fuselage, nose, wingL, wingR, tail], true, true, undefined, false, true);

    const nearZ = board.position.z - TABLE_SIZE/2 + MARGIN; // near edge (toward you)
    ship.position = new BABYLON.Vector3(0, TABLE_Y + 0.05, nearZ + 0.18);

    // Engine glow
    const glow = BABYLON.MeshBuilder.CreateDisc('glow', { radius: 0.06, tessellation: 32 }, scene);
    glow.rotation.x = Math.PI/2; glow.position = new BABYLON.Vector3(0, 0.02, ship.position.z - 0.18);
    const glowMat = new BABYLON.StandardMaterial('glowMat', scene);
    glowMat.emissiveColor = new BABYLON.Color3(0.2, 0.7, 1); glowMat.alpha = 0.6; glow.material = glowMat; glow.parent = ship;

    // Cursor (target) on board — world space
    const cursor = BABYLON.MeshBuilder.CreateDisc('cursor', { radius: 0.07, tessellation: 32 }, scene);
    const cursorMat = new BABYLON.StandardMaterial('cursorMat', scene);
    cursorMat.emissiveColor = new BABYLON.Color3(0.1, 0.85, 1); cursor.material = cursorMat;
    cursor.rotation.x = Math.PI/2; cursor.position.set(0, TABLE_Y + 0.01, ship.position.z + 0.6);

    // --- Movement: critically‑damped spring + arrive ---
    const target = cursor.position.clone();
    let vel = new BABYLON.Vector3();
    const MAX_SPEED   = 1.6;                 // m/s cap
    const MAX_ACCEL   = 7.0;                 // m/s^2 cap
    const STIFFNESS   = 18.0;                // spring k
    const DAMPING     = 2 * Math.sqrt(STIFFNESS) * 0.95; // ~critically damped
    const SLOW_RADIUS = 0.9;                 // ease-in radius
    const ARRIVE_EPS  = 0.02;

    function clampToBoard(vec) {
      const minX = board.position.x - TABLE_SIZE/2 + MARGIN;
      const maxX = board.position.x + TABLE_SIZE/2 - MARGIN;
      const minZ = board.position.z - TABLE_SIZE/2 + MARGIN;
      const maxZ = board.position.z + TABLE_SIZE/2 - MARGIN;
      vec.x = Math.min(maxX, Math.max(minX, vec.x));
      vec.z = Math.min(maxZ, Math.max(minZ, vec.z));
      vec.y = TABLE_Y + 0.05; // keep at table height
      return vec;
    }

    // Desktop pointer steering -> pick board in WORLD space
    scene.onPointerMove = () => {
      const pick = scene.pick(scene.pointerX, scene.pointerY, m => m === board);
      if (pick && pick.hit) {
        target.copyFrom(pick.pickedPoint);
        clampToBoard(target);
        cursor.position.copyFrom(target);
      }
    };

    // --- Bullets (pooled) ---
    const bulletPool = [];
    const BULLET_SPEED = 6.5;
    const BULLET_LIFE  = 1.25; // seconds
    const BULLET_RATE  = 0.12; // seconds between shots
    let lastShotTime = -999;

    function makeBullet() {
      const mesh = BABYLON.MeshBuilder.CreateCylinder('bullet', { diameter: 0.03, height: 0.20 }, scene);
      mesh.rotation.x = Math.PI/2;
      const mat = new BABYLON.StandardMaterial('bMat', scene);
      mat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.4); // yellowish
      mat.specularColor = BABYLON.Color3.Black();
      mesh.material = mat; mesh.setEnabled(false);
      return { mesh, active:false, vel:new BABYLON.Vector3(0,0,BULLET_SPEED), t:0 };
    }
    for (let i=0;i<60;i++) bulletPool.push(makeBullet());

    function shoot() {
      const now = performance.now()/1000;
      if (now - lastShotTime < BULLET_RATE) return;
      lastShotTime = now;
      const b = bulletPool.find(x=>!x.active); if (!b) return;
      b.active = true; b.t = 0; b.mesh.setEnabled(true);
      b.mesh.position.copyFrom(ship.position); b.mesh.position.y = ship.position.y + 0.01;
    }

    // Desktop input
    scene.onPointerDown = (evt)=>{ if (evt.button===0) shoot(); };
    window.addEventListener('keydown', (e)=>{ if (e.code==='Space') shoot(); if (e.code==='Enter') setRunning(!running); });

    // --- Drones (simple enemies) ---
    const drones = [];
    const droneMat = new BABYLON.StandardMaterial('droneMat', scene);
    droneMat.diffuseColor = new BABYLON.Color3(1.0, 0.83, 0.30); // warm yellow
    droneMat.emissiveColor = new BABYLON.Color3(0.9, 0.75, 0.25);

    function makeDrone(){
      const mesh = BABYLON.MeshBuilder.CreateSphere('drone', { diameter:0.24, segments:10 }, scene);
      mesh.material = droneMat; mesh.position.y = TABLE_Y + 0.05;
      const d = { mesh, speed: 0.9 + Math.random()*0.7 };
      respawnDrone(d); return d;
    }
    function respawnDrone(d){
      d.mesh.position.x = board.position.x - TABLE_SIZE/2 + MARGIN + Math.random()*(TABLE_SIZE-2*MARGIN);
      d.mesh.position.z = board.position.z + TABLE_SIZE/2 - 0.20; // far edge
      d.speed = 0.9 + Math.random()*0.7;
    }
    for (let i=0;i<12;i++) drones.push(makeDrone());

    // --- Explosions (world‑space; golden/amber) ---
    function explode(worldPos){
      const ps = new BABYLON.ParticleSystem('expl', 100, scene);
      ps.particleTexture = new BABYLON.Texture('https://playground.babylonjs.com/textures/flare.png', scene);
      ps.emitter = new BABYLON.Vector3(worldPos.x, worldPos.y, worldPos.z);
      ps.minEmitPower = 1; ps.maxEmitPower = 2.2;
      ps.minSize = 0.03; ps.maxSize = 0.09;
      ps.color1 = new BABYLON.Color4(1, 0.95, 0.5, 1);
      ps.color2 = new BABYLON.Color4(1, 0.70, 0.2, 1);
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
      ps.gravity = new BABYLON.Vector3(0, 0, 0);
      ps.emitRate = 0; ps.createSphereEmitter(0.22);
      ps.disposeOnStop = true; ps.manualEmitCount = 60; ps.start(); setTimeout(()=>ps.stop(), 80);
    }

    // --- GUI (score + pause indicator) ---
    const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI('ui', true, scene);
    const scoreText = new BABYLON.GUI.TextBlock(); scoreText.color = 'white'; scoreText.fontSize = 24; scoreText.top = '-45%'; gui.addControl(scoreText);
    const hintText = new BABYLON.GUI.TextBlock();
    hintText.text = `Desktop: move mouse to steer, Space to shoot, Enter to Start/Pause.
Quest VR: point to steer, Trigger to shoot, A/X to Start/Pause.`;
    hintText.color = '#eef'; hintText.fontSize = 18; hintText.top = '-40%'; gui.addControl(hintText);
    const pauseText = new BABYLON.GUI.TextBlock(); pauseText.text = 'PAUSED'; pauseText.color = '#fff'; pauseText.fontSize = 42; pauseText.isVisible = true; gui.addControl(pauseText);

    let running = false, score = 0; function setRunning(v){ running = v; pauseText.isVisible = !v; }

    // --- WebXR setup ---
    let xr = null;
    try {
      xr = await scene.createDefaultXRExperienceAsync({ disableDefaultUI:false });
      // Controller buttons: trigger = shoot, A/X = pause
      xr.input.onControllerAddedObservable.add((controller)=>{
        controller.onMotionControllerInitObservable.add((mc)=>{
          const trigger = mc.getComponentOfType('trigger');
          if (trigger) trigger.onButtonStateChangedObservable.add((c)=>{ if (c.changes.pressed && c.pressed) shoot(); });
          const aBtn = mc.getComponent('a-button') || mc.getComponent('x-button');
          if (aBtn) aBtn.onButtonStateChangedObservable.add((c)=>{ if (c.changes.pressed && c.pressed) setRunning(!running); });
        });
      });
    } catch(e){ console.warn('WebXR unavailable or failed to init.', e); }

    // XR & desktop steering: ray‑pick board (world‑space)
    function steerFromXRControllers(){
      if (!xr) return;
      xr.input.controllers.forEach((ctrl)=>{
        const pointer = ctrl.pointer; if (!pointer) return;
        const origin = pointer.getAbsolutePosition();
        const fwd    = pointer.getDirection(BABYLON.Axis.Z);
        const ray = new BABYLON.Ray(origin, fwd, 10);
        const pick = scene.pickWithRay(ray, (m)=>m===board);
        if (pick && pick.hit){ target.copyFrom(pick.pickedPoint); clampToBoard(target); cursor.position.copyFrom(target); }
      });
    }

    // --- Frame update ---
    scene.onBeforeRenderObservable.add(()=>{
      const dt = engine.getDeltaTime()/1000;
      steerFromXRControllers();

      scoreText.text = `Score: ${score} ${running ? '' : '(paused)'}`;

      // Scroll textures so ground appears to move TOWARD you
      const scrollSpeed = 0.45;
      groundTex.vOffset += dt * scrollSpeed * 0.25;
      gridTex.vOffset   += dt * scrollSpeed * 0.9;

      if (!running) return;

      // Ship motion (spring + arrive)
      clampToBoard(target);
      const toTarget = target.subtract(ship.position);
      const dist = toTarget.length();
      const arriveFactor = Math.min(1, dist / SLOW_RADIUS);
      let acc = toTarget.scale(STIFFNESS * arriveFactor).subtract(vel.scale(DAMPING));
      const accLen = acc.length(); if (accLen > MAX_ACCEL) acc.scaleInPlace(MAX_ACCEL/accLen);
      vel.addInPlace(acc.scale(dt));
      const speed = vel.length(); const maxSp = MAX_SPEED * (0.6 + 0.4*arriveFactor);
      if (speed > maxSp) vel.scaleInPlace(maxSp/speed);
      ship.position.addInPlace(vel.scale(dt)); clampToBoard(ship.position);
      if (dist < ARRIVE_EPS && speed < 0.05){ ship.position.copyFrom(target); vel.scaleInPlace(0); }

      // Bullets
      for (const b of bulletPool){
        if (!b.active) continue; b.t += dt; b.mesh.position.addInPlace(b.vel.scale(dt));
        if (b.t > BULLET_LIFE || b.mesh.position.z > board.position.z + TABLE_SIZE/2 + 0.3){ b.active=false; b.mesh.setEnabled(false); }
      }

      // Drones move toward near edge
      for (const d of drones){
        d.mesh.position.z -= d.speed * dt;
        if (d.mesh.position.z < board.position.z - TABLE_SIZE/2 + 0.20) respawnDrone(d);
      }

      // Collisions (2D XZ)
      outer: for (const d of drones){
        for (const b of bulletPool){
          if (!b.active) continue;
          const dx = b.mesh.position.x - d.mesh.position.x;
          const dz = b.mesh.position.z - d.mesh.position.z;
          if (dx*dx + dz*dz < 0.11*0.11){
            explode(d.mesh.position);
            score += 100; respawnDrone(d); b.active=false; b.mesh.setEnabled(false);
            continue outer;
          }
        }
      }
    });

    return scene;
  }

  createScene().then(scene => { engine.runRenderLoop(()=>scene.render()); });
  window.addEventListener('resize', ()=>engine.resize());
  </script>
</body>
</html>
